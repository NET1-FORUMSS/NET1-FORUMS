<!DOCTYPE html>

<style>
:root{

<body>

<header>
<h1>NET1 FORUMS</h1>
<img src="https://scontent.ftia13-1.fna.fbcdn.net/v/t39.30808-6/237009675_371797661182701_6477784088124245211_n.jpg"
class="forum-banner">
</header>

<div class="container">

<div id="auth" class="card">

<div class="tabs">
<button class="active" id="showRegisterBtn">Register</button>
<button id="showLoginBtn">Login</button>
</div>

<div id="registerForm">
<h2>Register</h2>
<input id="regEmail" type="email" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">
<button id="registerBtn">Sign Up</button>
</div>

<div id="loginForm" style="display:none;">
<h2>Login</h2>
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button id="loginBtn">Log In</button>
</div>

<hr>

<button id="googleLoginBtn" class="google-btn">
Sign in with Google
</button>

<p id="msg"></p>
</div>

<div id="post-area" class="card" style="display:none;">
<div style="display:flex;justify-content:space-between;">
<div id="greeting"></div>
<button id="logoutBtn">Logout</button>
</div>

<h2>Create a Post</h2>
<input id="postTitle" placeholder="Title">
<textarea id="postBody" placeholder="Your message"></textarea>
<button id="postBtn">Post</button>

<h2 style="margin-top:30px;">All Posts</h2>
<ul id="posts"></ul>
</div>

</div>

<script type="module">

import {initializeApp} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";

import{
getAuth,
createUserWithEmailAndPassword,
sendEmailVerification,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged,
GoogleAuthProvider,
signInWithPopup
}from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

import{
getFirestore,
collection,
addDoc,
getDocs
}from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCsRmrElDmH6MbEDKJrZRbXSuSUVKZMztU",
authDomain:"test-49ea8.firebaseapp.com",
projectId:"test-49ea8",
storageBucket:"test-49ea8.firebasestorage.app",
messagingSenderId:"868252671267",
appId:"1:868252671267:web:81104d814844984e8f0096"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const provider=new GoogleAuthProvider();

const msg=document.getElementById("msg");
const postArea=document.getElementById("post-area");
const greeting=document.getElementById("greeting");

const registerBtn=document.getElementById("registerBtn");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const googleLoginBtn=document.getElementById("googleLoginBtn");

const showRegisterBtn=document.getElementById("showRegisterBtn");
const showLoginBtn=document.getElementById("showLoginBtn");

const registerForm=document.getElementById("registerForm");
const loginForm=document.getElementById("loginForm");

showRegisterBtn.onclick=()=>{
registerForm.style.display="block";
loginForm.style.display="none";
showRegisterBtn.classList.add("active");
showLoginBtn.classList.remove("active");
}

showLoginBtn.onclick=()=>{
registerForm.style.display="none";
loginForm.style.display="block";
showLoginBtn.classList.add("active");
showRegisterBtn.classList.remove("active");
}

registerBtn.onclick=async()=>{
const email=regEmail.value.trim();
const password=regPassword.value.trim();

try{
const user=await createUserWithEmailAndPassword(auth,email,password);
await sendEmailVerification(user.user);

msg.style.color="green";
msg.innerText="Verification email sent!";
}catch(e){
msg.style.color="red";
msg.innerText=e.message;
}
}

loginBtn.onclick=async()=>{
try{
const user=await signInWithEmailAndPassword(auth,loginEmail.value,loginPassword.value);

if(!user.user.emailVerified){
msg.innerText="Verify email first.";
await signOut(auth);
}

}catch(e){
msg.innerText=e.message;
}
}

googleLoginBtn.onclick=async()=>{
try{
await signInWithPopup(auth,provider);
}catch(e){
msg.innerText=e.message;
}
}

logoutBtn.onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{

if(user){

document.getElementById("auth").style.display="none";
postArea.style.display="block";

greeting.innerText="Welcome "+(user.displayName||user.email);

loadPosts();

}else{

document.getElementById("auth").style.display="block";
postArea.style.display="none";

}

});

async function createPost(){

const title=postTitle.value.trim();
const body=postBody.value.trim();

if(!title||!body){
alert("Title and message required");
return;
}

await addDoc(collection(db,"posts"),{
title,
body,
createdAt:new Date().toISOString()
});

postTitle.value="";
postBody.value="";

loadPosts();
}

async function loadPosts(){

const posts=document.getElementById("posts");
posts.innerHTML="";

const query=await getDocs(collection(db,"posts"));

query.forEach(doc=>{

const data=doc.data();

const li=document.createElement("li");

li.innerHTML=`
<div class="title">${data.title}</div>
<div class="timestamp">${new Date(data.createdAt).toLocaleString()}</div>
<div class="body">${data.body}</div>
`;

posts.appendChild(li);

});

}

postBtn.onclick=createPost;

</script>

</body>
</html>
