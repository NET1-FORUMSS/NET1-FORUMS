<!DOCTYPE html>
<html>
<head>
  <title>Simple Forum</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f7fa;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
      font-weight: 700;
      letter-spacing: 1.2px;
    }

    #auth {
      background: white;
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgb(0 0 0 / 0.1);
      margin-bottom: 30px;
    }

    #auth div:first-child {
      text-align: center;
      margin-bottom: 20px;
    }

    .tab-btn {
      cursor: pointer;
      padding: 12px 25px;
      border: none;
      background: #ddd;
      margin: 0 8px;
      font-weight: 600;
      border-radius: 30px;
      transition: background-color 0.3s ease;
      color: #444;
      box-shadow: 0 2px 6px rgb(0 0 0 / 0.1);
    }

    .tab-btn:hover:not(.active) {
      background: #cfd8dc;
    }

    .tab-btn.active {
      background: #4285F4;
      color: white;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.6);
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      margin: 8px 0 15px;
      border: 1.5px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      transition: border-color 0.25s ease;
      resize: vertical;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #4285F4;
      box-shadow: 0 0 8px rgba(66, 133, 244, 0.3);
    }

    button {
      padding: 12px 28px;
      margin-top: 10px;
      background-color: #4285F4;
      color: white;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
    }

    button:hover {
      background-color: #3367d6;
    }

    #msg {
      color: #e74c3c;
      font-weight: 600;
      margin-top: 15px;
      text-align: center;
      min-height: 24px;
    }

    #post-area {
      background: white;
      padding: 30px 35px;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgb(0 0 0 / 0.1);
    }

    #logoutBtn {
      background: #e74c3c;
      padding: 10px 18px;
      margin-bottom: 25px;
      border: none;
      border-radius: 25px;
      font-weight: 700;
      cursor: pointer;
      float: right;
      box-shadow: 0 4px 12px rgba(231, 76, 60, 0.5);
      transition: background-color 0.3s ease;
    }

    #logoutBtn:hover {
      background: #c0392b;
    }

    #greeting {
      font-weight: 600;
      font-size: 18px;
      color: #34495e;
      margin-bottom: 30px;
    }

    #posts {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    #posts li {
      background: #f0f4f8;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgb(0 0 0 / 0.05);
      line-height: 1.4;
      color: #2c3e50;
      font-weight: 500;
      position: relative;
    }

    #posts li .title {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 6px;
      color: #2c3e50;
    }

    #posts li .timestamp {
      font-size: 12px;
      color: #7f8c8d;
      position: absolute;
      top: 15px;
      right: 15px;
      font-style: italic;
    }

    #posts li .body {
      white-space: pre-wrap;
    }

    /* Clear floats */
    .clearfix::after {
      content: "";
      clear: both;
      display: table;
    }
  </style>
</head>
<body>

  <h1>Simple Forum</h1>

  <div id="auth">
    <div>
      <button class="tab-btn active" id="showRegisterBtn">Register</button>
      <button class="tab-btn" id="showLoginBtn">Login</button>
    </div>

    <div id="registerForm">
      <h2>Register</h2>
      <input id="regEmail" type="email" placeholder="Email" />
      <input id="regPassword" type="password" placeholder="Password" />
      <button id="registerBtn">Register</button>
    </div>

    <div id="loginForm" style="display:none;">
      <h2>Login</h2>
      <input id="loginEmail" type="email" placeholder="Email" />
      <input id="loginPassword" type="password" placeholder="Password" />
      <button id="loginBtn">Login</button>
    </div>

    <p id="msg"></p>
  </div>

  <div id="post-area" style="display:none;">
    <div class="clearfix">
      <button id="logoutBtn">Logout</button>
      <div id="greeting"></div>
    </div>
    <h2>Create a Post</h2>
    <input id="postTitle" placeholder="Title" />
    <textarea id="postBody" placeholder="Your message"></textarea><br>
    <button id="postBtn">Post</button>

    <h2>All Posts</h2>
    <ul id="posts"></ul>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, sendEmailVerification,
      signInWithEmailAndPassword, signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsRmrElDmH6MbEDKJrZRbXSuSUVKZMztU",
      authDomain: "test-49ea8.firebaseapp.com",
      projectId: "test-49ea8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const msg = document.getElementById("msg");
    const greeting = document.getElementById("greeting");

    const showRegisterBtn = document.getElementById("showRegisterBtn");
    const showLoginBtn = document.getElementById("showLoginBtn");
    const registerForm = document.getElementById("registerForm");
    const loginForm = document.getElementById("loginForm");

    // Toggle between Register and Login forms
    showRegisterBtn.addEventListener("click", () => {
      registerForm.style.display = "block";
      loginForm.style.display = "none";
      msg.innerText = "";
      showRegisterBtn.classList.add("active");
      showLoginBtn.classList.remove("active");
    });
    showLoginBtn.addEventListener("click", () => {
      registerForm.style.display = "none";
      loginForm.style.display = "block";
      msg.innerText = "";
      showLoginBtn.classList.add("active");
      showRegisterBtn.classList.remove("active");
    });

    registerBtn.addEventListener("click", async () => {
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      msg.style.color = "red";
      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(userCred.user);
        msg.style.color = "green";
        msg.innerText = "Verification email sent! Please check your inbox and verify before login.";
      } catch (err) {
        msg.innerText = err.message;
      }
    });

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      msg.style.color = "red";
      try {
        const userCred = await signInWithEmailAndPassword(auth, email, password);
        if (!userCred.user.emailVerified) {
          msg.innerText = "Please verify your email before logging in.";
          await signOut(auth);
        } else {
          msg.innerText = "";
        }
      } catch (err) {
        msg.innerText = err.message;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      msg.innerText = "Logged out.";
      greeting.innerText = "";
    });

    onAuthStateChanged(auth, async (user) => {
      if (user && user.emailVerified) {
        document.getElementById("auth").style.display = "none";
        document.getElementById("post-area").style.display = "block";
        msg.innerText = "";
        greeting.innerText = `Welcome, ${user.email}!`;
        loadPosts();
      } else {
        document.getElementById("auth").style.display = "block";
        document.getElementById("post-area").style.display = "none";
        greeting.innerText = "";
      }
    });

    async function createPost() {
      const title = document.getElementById("postTitle").value.trim();
      const body = document.getElementById("postBody").value.trim();
      const user = auth.currentUser;
      if (!user || !user.emailVerified) {
        alert("You must verify your email first!");
        return;
      }
      if (!title || !body) {
        alert("Title and message cannot be empty");
        return;
      }
      try {
        await addDoc(collection(db, "posts"), {
          uid: user.uid,
          title,
          body,
          createdAt: new Date().toISOString()
        });
        alert("Post created!");
        document.getElementById("postTitle").value = "";
        document.getElementById("postBody").value = "";
        loadPosts();
      } catch (e) {
        alert("Error adding post: " + e.message);
      }
    }

    async function loadPosts() {
      const postsEl = document.getElementById("posts");
      postsEl.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "posts"));
      querySnapshot.forEach((doc) => {
        const post = doc.data();
        const li = document.createElement("li");
        const date = new Date(post.createdAt).toLocaleString();
        li.innerHTML = `
          <div class="title">${post.title}</div>
          <div class="timestamp">${date}</div>
          <div class="body">${post.body}</div>
        `;
        postsEl.appendChild(li);
      });
    }

    document.getElementById("postBtn").addEventListener("click", createPost);

  </script>

</body>
</html>
