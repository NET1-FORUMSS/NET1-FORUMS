<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forum App</title>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --accent: #4a90e2;
      --accent-dark: #3b7ecf;
      --text-dark: #333;
      --text-light: #666;
      --error: #e74c3c;
      --success: #27ae60;
      --input-border: #ccc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      line-height: 1.5;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 2rem;
      color: var(--accent);
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 30px 25px;
      margin-bottom: 30px;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .tabs button {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: var(--bg);
      color: var(--text-dark);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
      border-bottom: 2px solid transparent;
    }
    .tabs button.active {
      background: var(--card);
      color: var(--accent);
      border-bottom: 2px solid var(--accent);
    }

    input, textarea {
      width: 100%;
      padding: 12px 15px;
      margin-top: 15px;
      border: 1.5px solid var(--input-border);
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    input:focus, textarea:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 8px rgba(74, 144, 226, 0.3);
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      display: inline-block;
      padding: 12px 25px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.3s;
    }
    button:hover {
      background: var(--accent-dark);
    }

    #msg {
      margin-top: 20px;
      text-align: center;
      min-height: 24px;
    }

    #post-area .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    #logoutBtn {
      background: #e74c3c;
      padding: 10px 20px;
      border-radius: 6px;
    }
    #logoutBtn:hover {
      background: #c0392b;
    }
    #greeting {
      font-size: 1.1rem;
      color: var(--text-light);
    }

    #posts {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    #posts li {
      background: var(--card);
      border-radius: 8px;
      margin-bottom: 15px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    #posts li .title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
    }
    #posts li .timestamp {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 0.85rem;
      color: var(--text-light);
    }
    #posts li .body {
      white-space: pre-wrap;
      margin-top: 8px;
      color: var(--text-dark);
    }

    @media (max-width: 600px) {
      .card {
        padding: 20px 15px;
      }
      button {
        width: 100%;
        text-align: center;
      }
      #logoutBtn {
        margin-top: 0;
      }
      #post-area .top-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Forum App</h1>
  </header>

  <div class="container">
    <div id="auth" class="card">
      <div class="tabs">
        <button class="active" id="showRegisterBtn">Register</button>
        <button id="showLoginBtn">Login</button>
      </div>

      <div id="registerForm">
        <h2>Register</h2>
        <input id="regEmail" type="email" placeholder="Email" />
        <input id="regPassword" type="password" placeholder="Password" />
        <button id="registerBtn">Sign Up</button>
      </div>

      <div id="loginForm" style="display:none;">
        <h2>Login</h2>
        <input id="loginEmail" type="email" placeholder="Email" />
        <input id="loginPassword" type="password" placeholder="Password" />
        <button id="loginBtn">Log In</button>
      </div>

      <p id="msg"></p>
    </div>

    <div id="post-area" class="card" style="display:none;">
      <div class="top-bar">
        <div id="greeting"></div>
        <button id="logoutBtn">Logout</button>
      </div>
      <h2>Create a Post</h2>
      <input id="postTitle" placeholder="Title" />
      <textarea id="postBody" placeholder="Your message"></textarea>
      <button id="postBtn">Post</button>

      <h2 style="margin-top: 30px;">All Posts</h2>
      <ul id="posts"></ul>
    </div>
  </div>
