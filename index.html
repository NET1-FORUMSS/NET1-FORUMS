<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forum App</title>
  <style>
    /* Basic CSS for layout and style */
    :root {
      --primary-color: #6200ea;
      --primary-color-dark: #3700b3;
      --background: #f5f5f5;
      --text-light: #fff;
      --text-dark: #333;
      --error: #b00020;
      --success: #018786;
      --card-bg: #fff;
      --border-radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--background);
      margin: 0;
      padding: 0;
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      margin-bottom: 20px;
      text-align: center;
    }
    h1 {
      margin: 0;
      color: var(--primary-color);
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
    }
    .tabs button {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: #ddd;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s;
      border-radius: var(--border-radius) var(--border-radius) 0 0;
    }
    .tabs button.active {
      background: var(--primary-color);
      color: var(--text-light);
    }
    input[type="email"],
    input[type="password"],
    input#postTitle,
    textarea#postBody {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: var(--border-radius);
      border: 1px solid #ccc;
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
    }
    textarea#postBody {
      height: 100px;
    }
    button {
      background: var(--primary-color);
      color: var(--text-light);
      border: none;
      padding: 10px 15px;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background-color 0.3s;
    }
    button:hover {
      background: var(--primary-color-dark);
    }
    #msg {
      margin-top: 10px;
      font-weight: 600;
      min-height: 1.2em;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    #posts {
      list-style: none;
      padding-left: 0;
      max-height: 300px;
      overflow-y: auto;
    }
    #posts li {
      background: #eee;
      padding: 10px;
      border-radius: var(--border-radius);
      margin-bottom: 10px;
    }
    #posts li .title {
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--primary-color-dark);
    }
    #posts li .timestamp {
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 8px;
    }
    #posts li .body {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <header>
    <h1>Forum App</h1>
  </header>

  <div class="container">
    <div id="auth" class="card">
      <div class="tabs">
        <button class="active" id="showRegisterBtn">Register</button>
        <button id="showLoginBtn">Login</button>
      </div>

      <div id="registerForm">
        <h2>Register</h2>
        <input id="regEmail" type="email" placeholder="Email" />
        <input id="regPassword" type="password" placeholder="Password" />
        <button id="registerBtn">Sign Up</button>
      </div>

      <div id="loginForm" style="display:none;">
        <h2>Login</h2>
        <input id="loginEmail" type="email" placeholder="Email" />
        <input id="loginPassword" type="password" placeholder="Password" />
        <button id="loginBtn">Log In</button>
      </div>

      <p id="msg"></p>
    </div>

    <div id="post-area" class="card" style="display:none;">
      <div class="top-bar">
        <div id="greeting"></div>
        <button id="logoutBtn">Logout</button>
      </div>
      <h2>Create a Post</h2>
      <input id="postTitle" placeholder="Title" />
      <textarea id="postBody" placeholder="Your message"></textarea>
      <button id="postBtn">Post</button>

      <h2 style="margin-top: 30px;">All Posts</h2>
      <ul id="posts"></ul>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, sendEmailVerification,
      signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsRmrElDmH6MbEDKJrZRbXSuSUVKZMztU",
      authDomain: "test-49ea8.firebaseapp.com",
      projectId: "test-49ea8",
      storageBucket: "test-49ea8.appspot.com",
      messagingSenderId: "868252671267",
      appId: "1:868252671267:web:81104d814844984e8f0096",
      measurementId: "G-WWHHKPJCY9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Elements
    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const msg = document.getElementById("msg");

    const showRegisterBtn = document.getElementById("showRegisterBtn");
    const showLoginBtn = document.getElementById("showLoginBtn");
    const registerForm = document.getElementById("registerForm");
    const loginForm = document.getElementById("loginForm");

    const postArea = document.getElementById("post-area");
    const greeting = document.getElementById("greeting");

    // Tab toggling
    showRegisterBtn.addEventListener("click", () => {
      registerForm.style.display = "block";
      loginForm.style.display = "none";
      msg.innerText = "";
      showRegisterBtn.classList.add("active");
      showLoginBtn.classList.remove("active");
    });
    showLoginBtn.addEventListener("click", () => {
      registerForm.style.display = "none";
      loginForm.style.display = "block";
      msg.innerText = "";
      showLoginBtn.classList.add("active");
      showRegisterBtn.classList.remove("active");
    });

    // Register
    registerBtn.addEventListener("click", async () => {
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      msg.style.color = "var(--error)";
      if (!email || !password) {
        msg.innerText = "Email and Password are required.";
        return;
      }
      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(userCred.user);
        msg.style.color = "var(--success)";
        msg.innerText = "Verification email sent! Please check your inbox and verify before login.";
        document.getElementById("regEmail").value = "";
        document.getElementById("regPassword").value = "";
      } catch (err) {
        msg.style.color = "var(--error)";
        msg.innerText = err.message;
      }
    });

    // Login
    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      msg.style.color = "var(--error)";
      if (!email || !password) {
        msg.innerText = "Email and Password are required.";
        return;
      }
      try {
        const userCred = await signInWithEmailAndPassword(auth, email, password);
        if (!userCred.user.emailVerified) {
          msg.innerText = "Please verify your email before logging in.";
          await signOut(auth);
        } else {
          msg.innerText = "";
          document.getElementById("loginEmail").value = "";
          document.getElementById("loginPassword").value = "";
        }
      } catch (err) {
        msg.innerText = err.message;
      }
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      msg.style.color = "var(--text-dark)";
      msg.innerText = "Logged out.";
    });

    // Auth state change handler
    onAuthStateChanged(auth, async (user) => {
      if (user && user.emailVerified) {
        document.getElementById("auth").style.display = "none";
        postArea.style.display = "block";
        greeting.innerText = `Welcome, ${user.email}`;
        msg.innerText = "";
        loadPosts();
      } else {
        document.getElementById("auth").style.display = "block";
        postArea.style.display = "none";
        greeting.innerText = "";
      }
    });

    // Create post
    async function createPost() {
      const title = document.getElementById("postTitle").value.trim();
      const body = document.getElementById("postBody").value.trim();
      const user = auth.currentUser;
      if (!user || !user.emailVerified) {
        alert("You must verify your email first!");
        return;
      }
      if (!title || !body) {
        alert("Title and message cannot be empty");
        return;
      }
      try {
        await addDoc(collection(db, "posts"), {
          uid: user.uid,
          email: user.email,
          title,
          body,
          createdAt: new Date().toISOString()
        });
        alert("Post created!");
        document.getElementById("postTitle").value = "";
        document.getElementById("postBody").value = "";
        loadPosts();
      } catch (e) {
        alert("Error adding post: " + e.message);
      }
    }

    // Load posts
    async function loadPosts() {
      const postsEl = document.getElementById("posts");
      postsEl.innerHTML = "";
      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        querySnapshot.forEach((doc) => {
          const post = doc.data();
          const li = document.createElement("li");

          const titleEl = document.createElement("div");
          titleEl.className = "title";
          titleEl.textContent = post.title;

          const bodyEl = document.createElement("div");
          bodyEl.className = "body";
          bodyEl.textContent = post.body;

          const timestampEl = document.createElement("div");
          timestampEl.className = "timestamp";
          const date = new Date(post.createdAt);
          timestampEl.textContent = date.toLocaleString();

          li.appendChild(titleEl);
          li.appendChild(timestampEl);
          li.appendChild(bodyEl);

          postsEl.appendChild(li);
        });
      } catch (e) {
        console.error("Error loading posts: ", e);
      }
    }

    document.getElementById("postBtn").addEventListener("click", createPost);

  </script>
</body>
</html>
