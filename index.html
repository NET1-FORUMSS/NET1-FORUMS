<!DOCTYPE html>
<html>
<head>
  <title>Simple Forum</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    #auth {
      margin-bottom: 20px;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      box-sizing: border-box;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
    }
    .tab-btn {
      cursor: pointer;
      padding: 10px 20px;
      border: none;
      background: lightgray;
      margin-right: 5px;
      font-weight: bold;
    }
    .tab-btn.active {
      background: #4285F4;
      color: white;
    }
    #msg {
      color: red;
      margin-top: 10px;
    }
    #logoutBtn {
      margin-bottom: 20px;
      background: #f44336;
      color: white;
      border: none;
      cursor: pointer;
      padding: 8px 15px;
    }
  </style>
</head>
<body>

  <h1>Simple Forum</h1>

  <div id="auth">
    <div>
      <button class="tab-btn active" id="showRegisterBtn">Register</button>
      <button class="tab-btn" id="showLoginBtn">Login</button>
    </div>

    <div id="registerForm">
      <h2>Register</h2>
      <input id="regEmail" type="email" placeholder="Email" />
      <input id="regPassword" type="password" placeholder="Password" />
      <button id="registerBtn">Register</button>
    </div>

    <div id="loginForm" style="display:none;">
      <h2>Login</h2>
      <input id="loginEmail" type="email" placeholder="Email" />
      <input id="loginPassword" type="password" placeholder="Password" />
      <button id="loginBtn">Login</button>
    </div>

    <p id="msg"></p>
  </div>

  <div id="post-area" style="display:none;">
    <button id="logoutBtn">Logout</button>
    <h2>Create a Post</h2>
    <input id="postTitle" placeholder="Title" />
    <textarea id="postBody" placeholder="Your message"></textarea><br>
    <button id="postBtn">Post</button>
    <h2>All Posts</h2>
    <ul id="posts"></ul>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth, createUserWithEmailAndPassword, sendEmailVerification,
      signInWithEmailAndPassword, signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore, collection, addDoc, getDocs
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsRmrElDmH6MbEDKJrZRbXSuSUVKZMztU",
      authDomain: "test-49ea8.firebaseapp.com",
      projectId: "test-49ea8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const msg = document.getElementById("msg");

    const showRegisterBtn = document.getElementById("showRegisterBtn");
    const showLoginBtn = document.getElementById("showLoginBtn");
    const registerForm = document.getElementById("registerForm");
    const loginForm = document.getElementById("loginForm");

    // Toggle between Register and Login forms
    showRegisterBtn.addEventListener("click", () => {
      registerForm.style.display = "block";
      loginForm.style.display = "none";
      msg.innerText = "";
      showRegisterBtn.classList.add("active");
      showLoginBtn.classList.remove("active");
    });
    showLoginBtn.addEventListener("click", () => {
      registerForm.style.display = "none";
      loginForm.style.display = "block";
      msg.innerText = "";
      showLoginBtn.classList.add("active");
      showRegisterBtn.classList.remove("active");
    });

    registerBtn.addEventListener("click", async () => {
      const email = document.getElementById("regEmail").value;
      const password = document.getElementById("regPassword").value;
      msg.style.color = "red";
      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(userCred.user);
        msg.style.color = "green";
        msg.innerText = "Verification email sent! Please check your inbox and verify before login.";
      } catch (err) {
        msg.innerText = err.message;
      }
    });

    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;
      msg.style.color = "red";
      try {
        const userCred = await signInWithEmailAndPassword(auth, email, password);
        if (!userCred.user.emailVerified) {
          msg.innerText = "Please verify your email before logging in.";
          await signOut(auth);
        } else {
          msg.innerText = "";
        }
      } catch (err) {
        msg.innerText = err.message;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      msg.innerText = "Logged out.";
    });

    onAuthStateChanged(auth, async (user) => {
      if (user && user.emailVerified) {
        document.getElementById("auth").style.display = "none";
        document.getElementById("post-area").style.display = "block";
        msg.innerText = "";
        loadPosts();
      } else {
        document.getElementById("auth").style.display = "block";
        document.getElementById("post-area").style.display = "none";
      }
    });

    async function createPost() {
      const title = document.getElementById("postTitle").value;
      const body = document.getElementById("postBody").value;
      const user = auth.currentUser;
      if (!user || !user.emailVerified) {
        alert("You must verify your email first!");
        return;
      }
      if (!title.trim() || !body.trim()) {
        alert("Title and message cannot be empty");
        return;
      }
      try {
        await addDoc(collection(db, "posts"), {
          uid: user.uid,
          title,
          body,
          createdAt: new Date().toISOString()
        });
        alert("Post created!");
        document.getElementById("postTitle").value = "";
        document.getElementById("postBody").value = "";
        loadPosts();
      } catch (e) {
        alert("Error adding post: " + e.message);
      }
    }

    async function loadPosts() {
      const postsEl = document.getElementById("posts");
      postsEl.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "posts"));
      querySnapshot.forEach((doc) => {
        const post = doc.data();
        const li = document.createElement("li");
        li.innerText = `${post.title}: ${post.body}`;
        postsEl.appendChild(li);
      });
    }

    document.getElementById("postBtn").addEventListener("click", createPost);

  </script>

</body>
</html>
