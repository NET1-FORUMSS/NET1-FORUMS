<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NET1 FORUMS</title>
  <style>
    /* Add your existing CSS code here */
    .google-btn {
      background: #db4437;
      margin-top: 10px;
      padding: 12px 25px;
      color: white;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-weight: 600;
      width: 100%;
    }

    /* Add your other styles here */
  </style>
</head>
<body>
  <header>
    <h1>NET1 FORUMS</h1>
    <img
      src="https://your-image-link.jpg"
      alt="Forum banner"
      class="forum-banner"
    />
  </header>

  <div class="container">
    <div id="auth" class="card">
      <div class="tabs">
        <button class="active" id="showRegisterBtn">Register</button>
        <button id="showLoginBtn">Login</button>
      </div>

      <div id="registerForm">
        <h2>Register</h2>
        <input id="regEmail" type="email" placeholder="Email" />
        <input id="regPassword" type="password" placeholder="Password" />
        <button id="registerBtn">Sign Up</button>
      </div>

      <div id="loginForm" style="display:none;">
        <h2>Login</h2>
        <input id="loginEmail" type="email" placeholder="Email" />
        <input id="loginPassword" type="password" placeholder="Password" />
        <button id="loginBtn">Log In</button>
      </div>

      <button id="googleLoginBtn" class="google-btn">
        Sign in with Google
      </button>

      <p id="msg"></p>
    </div>

    <div id="post-area" class="card" style="display:none;">
      <div class="top-bar">
        <div id="greeting"></div>
        <button id="logoutBtn">Logout</button>
      </div>
      <h2>Create a Post</h2>
      <input id="postTitle" placeholder="Title" />
      <textarea id="postBody" placeholder="Your message"></textarea>
      <button id="postBtn">Post</button>

      <h2 style="margin-top: 30px;">All Posts</h2>
      <ul id="posts"></ul>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsRmrElDmH6MbEDKJrZRbXSuSUVKZMztU",
      authDomain: "test-49ea8.firebaseapp.com",
      projectId: "test-49ea8",
      storageBucket: "test-49ea8.firebasestorage.app",
      messagingSenderId: "868252671267",
      appId: "1:868252671267:web:81104d814844984e8f0096",
      measurementId: "G-WWHHKPJCY9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const provider = new GoogleAuthProvider();

    // Elements
    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const googleLoginBtn = document.getElementById("googleLoginBtn");
    const msg = document.getElementById("msg");
    const showRegisterBtn = document.getElementById("showRegisterBtn");
    const showLoginBtn = document.getElementById("showLoginBtn");
    const registerForm = document.getElementById("registerForm");
    const loginForm = document.getElementById("loginForm");
    const postArea = document.getElementById("post-area");
    const greeting = document.getElementById("greeting");

    // Google Sign-In Button
    googleLoginBtn.addEventListener("click", async () => {
      googleLoginBtn.disabled = true; // Disable button to avoid multiple clicks
      try {
        await signInWithPopup(auth, provider);
        msg.style.color = "var(--success)";
        msg.innerText = "Logged in with Google!";
      } catch (err) {
        msg.style.color = "var(--error)";
        msg.innerText = err.message;
      } finally {
        googleLoginBtn.disabled = false; // Re-enable button after sign-in attempt
      }
    });

    // Register
    registerBtn.addEventListener("click", async () => {
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      msg.style.color = "var(--error)";
      if (!email || !password) {
        msg.innerText = "Email and Password are required.";
        return;
      }
      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        await sendEmailVerification(userCred.user);
        msg.style.color = "var(--success)";
        msg.innerText = "Verification email sent! Please check your inbox.";
      } catch (err) {
        msg.style.color = "var(--error)";
        msg.innerText = err.message;
      }
    });

    // Login
    loginBtn.addEventListener("click", async () => {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      msg.style.color = "var(--error)";
      if (!email || !password) {
        msg.innerText = "Email and Password are required.";
        return;
      }
      try {
        const userCred = await signInWithEmailAndPassword(auth, email, password);
        if (!userCred.user.emailVerified) {
          msg.innerText = "Please verify your email before logging in.";
          await signOut(auth);
        } else {
          msg.innerText = "";
          document.getElementById("loginEmail").value = "";
          document.getElementById("loginPassword").value = "";
        }
      } catch (err) {
        msg.innerText = err.message;
      }
    });

    // Logout
    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      msg.style.color = "var(--text-dark)";
      msg.innerText = "Logged out.";
    });

    // Auth state change handler
    onAuthStateChanged(auth, async (user) => {
      if (user && user.emailVerified) {
        document.getElementById("auth").style.display = "none";
        postArea.style.display = "block";
        greeting.innerText = `Welcome, ${user.email}`;
        msg.innerText = "";
        loadPosts();
      } else {
        document.getElementById("auth").style.display = "block";
        postArea.style.display = "none";
        greeting.innerText = "";
      }
    });

    // Load posts
    async function loadPosts() {
      const postsEl = document.getElementById("posts");
      postsEl.innerHTML = "";
      try {
        const querySnapshot = await getDocs(collection(db, "posts"));
        querySnapshot.forEach((doc) => {
          const post = doc.data();
          const li = document.createElement("li");

          const titleEl = document.createElement("div");
          titleEl.className = "title";
          titleEl.textContent = post.title;

          const bodyEl = document.createElement("div");
          bodyEl.className = "body";
          bodyEl.textContent = post.body;

          const timestampEl = document.createElement("div");
          timestampEl.className = "timestamp";
          const date = new Date(post.createdAt);
          timestampEl.textContent = date.toLocaleString();

          li.appendChild(titleEl);
          li.appendChild(timestampEl);
          li.appendChild(bodyEl);

          postsEl.appendChild(li);
        });
      } catch (e) {
        console.error("Error loading posts: ", e);
      }
    }
  </script>
</body>
</html>
